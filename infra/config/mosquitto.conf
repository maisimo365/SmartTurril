# ============================================================
#  SmartTurril - Configuracion de Eclipse Mosquitto
# ============================================================

# --- Listener MQTT estandar (TCP) ---
# Puerto utilizado por el ESP32 y clientes MQTT nativos
listener 1883
protocol mqtt

# --- Listener MQTT sobre WebSockets ---
# Puerto utilizado por el Dashboard Next.js desde el navegador
listener 9001
protocol websockets

# --- Autenticacion (SOLO PARA DESARROLLO) ---
# ADVERTENCIA: Cambiar a autenticacion con usuario/contrasena en produccion
allow_anonymous true

# --- Persistencia de mensajes ---
persistence true
persistence_location /mosquitto/data/

# --- Logs ---
log_dest file /mosquitto/log/mosquitto.log
log_type all
